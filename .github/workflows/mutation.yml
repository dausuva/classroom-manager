#
# Mutation test of the protocol library (src/Shared): Stryker.NET breaks the code in small deliberate ways and the tests must notice.
# It takes tens of minutes, so it runs once a week and on request, not on every change. The score goes to the job summary and the report is kept.
name: Mutation test

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    if: github.repository == 'dausuva/classroom-manager'
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore

      # Fails when the score falls below the floor in tests/mutation-floor.json.
      - name: Mutation test of src/Shared
        shell: pwsh
        run: ./scripts/Test-Mutation.ps1

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: tests/ClassroomManager.Shared.Tests/StrykerOutput
          if-no-files-found: ignore
