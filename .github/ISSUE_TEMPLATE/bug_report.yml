name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A security problem is **not** an issue: see SECURITY.md. Do not paste keys, lab addresses or pupil data.
  - type: dropdown
    id: program
    attributes:
      label: Which program
      options: [Host (teacher console), Client (student PC), Installer, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The file version of ClassroomHost.exe or ClassroomClient.exe (Help > About in the Host)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
